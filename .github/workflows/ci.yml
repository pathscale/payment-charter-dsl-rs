name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubicloud-standard-2
    env:
      # The conformance suite is the shared corpus in the spec repo, not local tests. Without
      # this the harnesses fall back to a sibling path, find nothing, and skip — reporting
      # green for a run that checked no fixtures at all.
      CHARTER_CORPUS: ${{ github.workspace }}/siblings/payment-charter-dsl/conformance
    steps:
      - uses: actions/checkout@v4

      # The corpus lives inside GITHUB_WORKSPACE because actions/checkout refuses a path
      # outside it, and the harnesses are pointed at it by environment variable rather than by
      # reproducing a directory layout with symlinks.
      #
      # A corpus branch of the same name is preferred when one exists. The spec and the
      # implementation are separate repositories, so a change that adds a rule and the fixtures
      # proving it is two pull requests, and testing the new rule against the old corpus tests
      # nothing. Falling back to the default branch is what keeps this working for the ordinary
      # change that adds no fixtures.
      - name: Checkout the spec and corpus
        run: |
          repo=https://github.com/pathscale/payment-charter-dsl
          branch="${{ github.head_ref }}"
          if [ -n "$branch" ] && git clone --depth 1 --branch "$branch" "$repo" siblings/payment-charter-dsl 2>/dev/null; then
            echo "corpus: $branch"
          else
            git clone --depth 1 "$repo" siblings/payment-charter-dsl
            echo "corpus: default branch"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # pays-policy links into the enclave, so its two invariants are worth asserting in CI
      # rather than in a comment: it must build with no dependencies at all, and it must build
      # for a target with no standard library. A dependency added by accident fails here.
      - name: pays-policy has no dependencies
        run: |
          deps=$(cargo tree -p pays-policy --edges normal --prefix none | tail -n +2 | sort -u)
          if [ -n "$deps" ]; then
            echo "pays-policy must be dependency-free; found:"
            echo "$deps"
            exit 1
          fi

      - name: pays-policy builds for no_std
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build -p pays-policy --target thumbv7em-none-eabi
